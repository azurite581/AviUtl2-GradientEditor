name: Release

run-name: Release
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release_project:
    name: Release project
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

    # タグから 'v' を取り除いたものを保存
    - name: Extract version
      id: extract-version
      run: |
        $version = "$env:GITHUB_REF_NAME".TrimStart('v')
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Install yq
      run: |
        choco install yq -y

    # aulua の VERSION 変数を置き換える
    - name: aulua variable update
      run: |
        $version = "v$env:VERSION"
        yq -i ".project.variables.VERSION = `"$version`"" ./script/aulua.yaml
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    # CMakePresets.json の PLUGIN_VERSION 変数を置き換える
    - name: CMakePresets.json variable update
      run: |
        yq -i '(.configurePresets[] | select(.name == "windows-base")).cacheVariables.PLUGIN_VERSION = env(VERSION)' ./CMakePresets.json
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
    - name: Build project
      run: |
        mkdir release
        au2 release --set-version "$env:VERSION"
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    - name: Commit version change
      run: |
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git add script/aulua.yaml CMakePresets.json
        git commit -m "feat: update config files version v$env:VERSION"
        git branch
        git push origin HEAD:main
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}

    - name: Create release notes
      run: |
        dotnet .\tools\ChangelogExtract.cs -- .\CHANGELOG.md .\EXTRACTED.md --semver "$env:VERSION"
        Move-Item -Path "release\*.au2pkg.zip" -Destination .\
        gh release create "v$env:VERSION" --notes-file EXTRACTED.md "*.au2pkg.zip"
      env:
        VERSION: ${{ steps.extract-version.outputs.version }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
