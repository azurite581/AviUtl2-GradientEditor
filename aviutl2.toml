#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。
[project]
id = "gradient-editor"
name = "GradientEditor"
version = "0.4.0"

[artifacts.GradientEditor_aux2]
destination = "Plugin/GradientEditor.aux2"

[artifacts.GradientEditor_aux2.profiles.debug]
source = "./out/build/windows-x64-debug/Debug/GradientEditor.aux2"
build = "cmake --workflow debug-flow"

[artifacts.GradientEditor_aux2.profiles.release]
source = "./out/build/windows-x64-release/Release/GradientEditor.aux2"
build = "cmake --workflow release-flow"

[artifacts.GradientEditor_anm2]
build = "cd ./script && aulua build"
source = "./out_script/@GradientEditor.anm2"
destination = "Script/@GradientEditor.anm2"

[artifacts.English_GradientEditor_aul2]
source = "./i18n/English.GradientEditor.aul2"
destination = "Language/English.GradientEditor.aul2"

[artifacts.SimplifiedChinese_GradientEditor_aul2]
source = "./i18n/简体中文.GradientEditor.aul2"
destination = "Language/简体中文.GradientEditor.aul2"

[artifacts.GradientEditor_ini]
source = "./GradientEditor.ini"
destination = "Plugin/GradientEditor.ini"

[artifacts.GradientEditor_default_preset_json]
source = "./preset/gradient_editor_default_preset.json"
destination = "Plugin/GradientEditorPreset/gradient_editor_default_preset.json"

[development]
aviutl2_version = "latest"

[preview]

[release]
package_template = "package.txt"
profile = "release"
output_dir = "release"
zip_name = "{name}-v{version}"
include = ["GradientEditor_aux2", "GradientEditor_anm2", "English_GradientEditor_aul2", "SimplifiedChinese_GradientEditor_aul2", "GradientEditor_ini", "GradientEditor_default_preset_json"]
